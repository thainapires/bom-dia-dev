services:
  backend:
    build: ./backend
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    env_file:
      - .env
    environment:
      - PORT=3001

  web:
    build: ./web
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    environment:
      - VITE_API_TARGET=http://backend:3001

volumes:
  backend_node_modules:
  web_node_modules:
