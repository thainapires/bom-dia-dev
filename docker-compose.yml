services:
  server:
    build: ./server
    ports:
      - "3001:3001"
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
    env_file:
      - .env
    environment:
      - PORT=3001

  web:
    build: ./web
    ports:
      - "5173:5173"
    depends_on:
      - server
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    environment:
      - VITE_API_TARGET=http://server:3001

volumes:
  server_node_modules:
  web_node_modules:
